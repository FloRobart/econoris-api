services:
  econoris-api:
    image: node:24-alpine
    working_dir: /app
    env_file: .env
    volumes:
      - ./:/app/
    command: sh -c "cd /app && npm run dev"
    networks:
      - flower-garden-net
      - econoris-net
    ports:
      - ${APP_PORT:-}:80
    user: "1800:1800"
    tmpfs:
      - /tmp:exec,nosuid,nodev

networks:
  flower-garden-net:
    external: true
  econoris-net:
    external: true