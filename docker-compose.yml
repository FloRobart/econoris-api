services:
  econoris-api:
    image: florobart/econoris-api:latest
    working_dir: /app
    restart: always
    env_file: .env
    networks:
      - flower-garden-net
      - econoris-net
    ports:
      - ${APP_PORT:-}:80
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    user: "1800:1800"
    tmpfs:
      - /tmp:exec,nosuid,nodev
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://econoris-api:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  flower-garden-net:
    external: true
  econoris-net:
    external: true
